# Netlify Configuration — Monorepo
# Web app lives in the /web subdirectory.
# NOTE: when base = "web", all paths below are relative to /web
[build]
base      = "web"
command   = "npm run build"
publish   = "dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "20"

# Tell secrets scanner to ignore the compiled JS bundle.
# VITE_* vars are intentionally public (anon key, public VAPID key) —
# they are safe to ship in browser code. The scanner flags them because
# they match env var names, not because they are actually secret.
SECRETS_SCAN_OMIT_PATHS = "dist"

# Security headers
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets forever (content-hashed filenames)
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback — must be last
[[redirects]]
from   = "/*"
to     = "/index.html"
status = 200
