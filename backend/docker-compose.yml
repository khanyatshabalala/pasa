version: "3.9"

services:
  pasa-backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - PASA_CORS_ORIGINS=${PASA_CORS_ORIGINS:-http://localhost:5173}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
