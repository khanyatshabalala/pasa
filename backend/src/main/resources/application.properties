spring.application.name=pasa-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ── Database (Supabase PostgreSQL or Railway PostgreSQL) ─────────────────
# Connection pooler (port 6543) is recommended for serverless/short-lived connections.
# For a persistent server use the direct connection (port 5432).
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://db.pbhppoanxwbbbinrcwdj.supabase.co:5432/postgres}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${SUPABASE_DB_PASSWORD:postgres}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate = checks schema matches entities; use none in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Map PostgreSQL enums correctly
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── JWT ──────────────────────────────────────────────────────────────────────
# Generate with: openssl rand -hex 64
pasa.jwt.secret=${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret}
# Token validity in milliseconds (24 h = 86400000)
pasa.jwt.expiration-ms=86400000

# ── CORS ──────────────────────────────────────────────────────────────────────
pasa.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.netlify.app,https://your-netlify-app.netlify.app}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.pasa=DEBUG
logging.level.org.springframework.security=INFO

# ── Swagger / OpenAPI ────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.info.title=PASA API
springdoc.info.description=Parent and School Alliance — REST API
springdoc.info.version=1.0.0

# ── Actuator ─────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=PASA Backend
info.app.version=1.0.0
info.app.description=Parent and School Alliance API

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
