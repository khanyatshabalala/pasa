spring.application.name=pasa-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ── Database (Supabase PostgreSQL, Railway Postgres, or local H2 fallback) ─
# If no DB variables are provided, the app starts with an in-memory H2 database so the backend can still deploy.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:pasa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${SUPABASE_DB_PASSWORD:}}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DATABASE_DRIVER_CLASS_NAME:org.h2.Driver}}

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}}
# Disable DDL generation for the H2 fallback so the app can boot without trying to create PostgreSQL enum types.
# Override with validate/update when a real Postgres database is configured.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:${HIBERNATE_DDL_AUTO:none}}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Map PostgreSQL enums correctly
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── JWT ──────────────────────────────────────────────────────────────────────
# Generate with: openssl rand -hex 64
pasa.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
# Token validity in milliseconds (24 h = 86400000)
pasa.jwt.expiration-ms=86400000

# ── CORS ──────────────────────────────────────────────────────────────────────
pasa.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.netlify.app,https://your-netlify-app.netlify.app}

# ── Object storage (S3-compatible, e.g. Supabase storage) ────────────────────
# Report-card PDFs are streamed through the backend. Leave blank to disable storage
# (the app still boots; storage calls return 503 until configured).
pasa.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}
pasa.storage.s3.region=${STORAGE_S3_REGION:us-east-1}
pasa.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
pasa.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
pasa.storage.s3.bucket=${STORAGE_S3_BUCKET:report-cards}

# ── Multipart (report-card uploads) ──────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.pasa=DEBUG
logging.level.org.springframework.security=INFO

# ── Swagger / OpenAPI ────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.info.title=PASA API
springdoc.info.description=Parent and School Alliance — REST API
springdoc.info.version=1.0.0

# ── Actuator ─────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=PASA Backend
info.app.version=1.0.0
info.app.description=Parent and School Alliance API

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
